format: "roboact-flow"
format_version: 1
flow:
  id: "flow-sample"
  name: "sample"
  revision: 3
  step_limit: 200
  action_list_version: "fake-v1"
  adapter:
    name: "Fake adapter"
    version: "0.2"
    target: "sim"
  robot:
    id: "fake-1"
    model: "FakeArm"
  units:
    angle: "rad"
    length: "m"
nodes:
  - id: "note"
    kind: "action"
    action: "fake_note"
    title: "Note"
    params:
      mode: "on"
      token: null
      ver: "1.10"
    position:
      x: 40
      y: 320
  - id: "go"
    kind: "action"
    action: "fake_set_pose"
    title: "Go"
    params:
      x: 0.4
      y: 0.1
      z: 0.2
    position:
      x: 400
      y: 160
  - id: "c_empty"
    kind: "constant"
    title: "Empty"
    params:
      value: ""
      value_type: "string"
    position:
      x: 40
      y: 480
  - id: "c_float"
    kind: "constant"
    title: "Float"
    params:
      value: 0.1
      value_type: "number"
    position:
      x: 200
      y: 480
  - id: "c_on"
    kind: "constant"
    title: "On"
    params:
      value: "on"
      value_type: "string"
    position:
      x: 40
      y: 400
  - id: "c_oct"
    kind: "constant"
    title: "Oct"
    params:
      value: "0123"
      value_type: "string"
    position:
      x: 200
      y: 400
  - id: "c_ver"
    kind: "constant"
    title: "Ver"
    params:
      value: "1.10"
      value_type: "string"
    position:
      x: 360
      y: 400
  - id: "cond"
    kind: "condition"
    title: "Cond"
    params:
      compare: 1
      field: "value"
      op: "gte"
    position:
      x: 200
      y: 160
  - id: "out"
    kind: "output"
    title: "Out"
    params: {}
    position:
      x: 600
      y: 160
  - id: "start"
    kind: "start"
    title: "Start"
    params:
      data:
        flag: true
        neg_zero: -0.0
        nested:
          a: 1
          b: 2
        one_float: 1.0
        one_int: 1
        ratio: 0.1
        tags:
          - "z"
          - "a"
          - "m"
        tiny: 1e-07
        value: 0
    position:
      x: 40
      y: 160
edges:
  - from:
      node: "start"
      port: "data"
    to:
      node: "cond"
      port: "value"
  - from:
      node: "cond"
      port: "no"
    to:
      node: "go"
      port: "target"
  - from:
      node: "go"
      port: "pose"
    to:
      node: "cond"
      port: "value"
  - from:
      node: "cond"
      port: "yes"
    to:
      node: "out"
      port: "value"
