name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor hash check
        run: python scripts/check_manifest.py
      - name: Tamper must fail
        run: |
          f=web/vendor/vue-flow-minimap.css
          cp "$f" /tmp/vf-css.bak
          printf x >> "$f"
          if python scripts/check_manifest.py; then
            echo "expected hash mismatch"; mv /tmp/vf-css.bak "$f"; exit 1
          fi
          mv /tmp/vf-css.bak "$f"
          python scripts/check_manifest.py
      - name: Install runtime offline
        run: pip install --no-index --find-links vendor/wheels -r requirements.txt
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Pytest
        env:
          ROBOACT_TEST: "1"
        run: pytest -q --tb=short
