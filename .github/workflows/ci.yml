name: ci
on:
  push:
  pull_request:

jobs:
  check:
    # Playwright 1.55 cannot install Chromium dependencies on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Offline ruamel from vendor wheels
        run: |
          set -euo pipefail
          OFF=/tmp/offline-ruamel
          rm -rf "$OFF"
          if python3 -m venv "$OFF"; then
            "$OFF/bin/pip" install --no-index --no-deps --find-links vendor/wheels 'ruamel.yaml==0.18.16'
          else
            rm -rf "$OFF"
            python3 -m venv --without-pip "$OFF"
            uv pip install --python "$OFF/bin/python" --no-index --no-deps --find-links vendor/wheels 'ruamel.yaml==0.18.16'
          fi
          "$OFF/bin/python" -c "import ruamel.yaml; print(ruamel.yaml.__version__)"
      - name: Vendor hash check
        run: python3 scripts/check_manifest.py
      - name: Tamper must fail
        run: |
          f=web/vendor/vue-flow-minimap.css
          cp "$f" /tmp/vf-css.bak
          printf x >> "$f"
          if python3 scripts/check_manifest.py; then
            echo "expected hash mismatch"; mv /tmp/vf-css.bak "$f"; exit 1
          fi
          mv /tmp/vf-css.bak "$f"
          python3 scripts/check_manifest.py
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Chromium for Playwright
        run: |
          set -euo pipefail
          uv sync --locked
          uv run python -m playwright install --with-deps chromium
          uv run python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(args=['--no-sandbox']); b.close(); p.stop()"
      - name: Check
        run: bash scripts/check.sh

  test-aarch64:
    # Browser tests run here too: Chromium is installed, and a missing browser fails pytest.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Offline ruamel from vendor wheels
        run: |
          set -euo pipefail
          OFF=/tmp/offline-ruamel
          rm -rf "$OFF"
          if python3 -m venv "$OFF"; then
            "$OFF/bin/pip" install --no-index --no-deps --find-links vendor/wheels 'ruamel.yaml==0.18.16'
          else
            rm -rf "$OFF"
            python3 -m venv --without-pip "$OFF"
            uv pip install --python "$OFF/bin/python" --no-index --no-deps --find-links vendor/wheels 'ruamel.yaml==0.18.16'
          fi
          "$OFF/bin/python" -c "import ruamel.yaml; print(ruamel.yaml.__version__)"
      - name: Install (frozen, aarch64 wheels)
        run: uv sync --frozen
      - name: Install Chromium for Playwright
        run: |
          set -euo pipefail
          if ! uv run python -m playwright install --with-deps chromium; then
            uv run python -m playwright install chromium
          fi
          uv run python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(args=['--no-sandbox']); b.close(); p.stop()"
      - name: Pytest
        env:
          ROBOACT_TEST: "1"
        run: uv run pytest -q --tb=short
