[project]
name = "roboact"
version = "0.1.0"
description = "Offline, zero-build robot flow canvas"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "alexzhang1030" }]
dependencies = [
    "pydantic==2.14.2",
    "ruamel-yaml==0.18.16",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pyright==1.1.414",
    "pytest==8.4.2",
    "playwright==1.55.0",
    "pillow==11.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roboact"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["roboact", "tests", "scripts"]
extend-exclude = ["docs", "web", "vendor", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Catalog strings and identifiers may use ambiguous Unicode (ellipsis, ×).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["roboact"]
exclude = ["tests"]
typeCheckingMode = "strict"
# NodeType.run is specialized per Inputs/Params after parse_inputs / parse_params.
reportIncompatibleMethodOverride = false
# Flow graphs, run records, and adapter payloads are JSON objects.
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeArgument = false
